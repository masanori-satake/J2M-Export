# Jira to Markdown Exporter 設定サンプル

# JiraのベースURL (例: https://jira.example.com)
base_url: "https://your-jira.com"

# 対象とするプロジェクトキー（リスト形式）
proj_keys:
  - "PROJ"
  - "OTHER"

# または JQL を使用して対象を指定
# jql: "project = PROJ AND status = 'In Progress'"

# 対象とするラベル（指定されたいずれかに合致するものを抽出）
# labels:
#   - "target-label-1"
#   - "target-label-2"

# Bearerトークン
token: "your_bearer_token_here"

# 除外するフィールドの内部ID（リスト形式）
# exclude_fields:
#   - "priority"
#   - "reporter"

# 出力先ディレクトリ (既定: output)
output_dir: "output"

# 1ファイルあたりの最大サイズ (MB) (既定: 95.0)
# このサイズを超えそうな場合、ファイルが分割されます
max_mb: 95.0

# 実行全体で処理する合計サイズの上限 (MB) (既定: 950.0)
# このサイズに達した時点で、チケットの収集を停止します
stop_threshold_mb: 950.0

# HTTP/HTTPS プロキシURL
# proxy: "http://proxy.example.com:8080"

# 同名ファイルが存在する場合に上書きする (既定: false)
# false の場合はファイル名に年月日時分秒のSuffixが付与されます
overwrite: false
